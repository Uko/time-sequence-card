name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: node24
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: git diff --exit-code -- dist/
