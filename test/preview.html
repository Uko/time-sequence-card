<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Time Sequence Card</title>
<style>body{margin:32px;background:#101820;color:#e7eef4;font:16px system-ui;--primary-text-color:#e7eef4;--secondary-text-color:#a5b6c5;--ha-card-background:#1b2834;--primary-color:#64c5dc}main{max-width:900px;margin:auto}h1{font-size:24px}p{color:#a5b6c5}time-sequence-card{display:block;margin:24px 0}</style>
<main><h1>Time Sequence Card</h1><p>Fixed windows · manual start or a daily deadline</p></main>
<script type="module">
import '/dist/time-sequence-card.js';
const manual=document.createElement('time-sequence-card');
manual.setConfig({type:'custom:time-sequence-card',title:'Presentation',mode:'manual',phases:[{label:'Laptop setup',duration:'00:01:00'},{label:'Talk',duration:'00:10:00'},{label:'Questions',duration:'00:03:00'}]});
manual.hass={config:{time_zone:'UTC'}};document.querySelector('main').append(manual);
const routine=document.createElement('time-sequence-card');
routine.setConfig({type:'custom:time-sequence-card',title:'Morning routine',mode:'scheduled',anchor:{at:'08:25',edge:'end'},phases:[{label:'Breakfast',duration:'00:15:00'},{label:'Brush teeth',duration:'00:05:00'},{label:'Get dressed',duration:'00:10:00'},{label:'Leave',duration:'00:10:00'},{label:'Buffer',duration:'00:05:00'}]});
routine.hass={config:{time_zone:'UTC'}};document.querySelector('main').append(routine);
</script></html>
